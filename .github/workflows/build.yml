name: build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node tools/build.mjs --all
      - name: Screenshots (CPU rendering)
        run: |
          for p in dist/*/index.html; do node tools/shots.mjs "$p" --cpu; done
      - uses: actions/upload-artifact@v4
        with:
          name: explainers
          path: |
            dist/
            shots/
