<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--c-bg,#fff);color:var(--c-ink,#0f1b2d);font-family:var(--f-family,system-ui,sans-serif)}
#view{position:fixed;inset:0}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
#leaders{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#leaders line{stroke:var(--c-accent);stroke-width:1.2}
#leaders circle{fill:var(--c-bg);stroke:var(--c-accent);stroke-width:1.5}
#notes{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.note{position:absolute;left:0;top:0;background:rgba(255,255,255,.92);border-left:2px solid var(--c-accent);border-radius:4px;padding:4px 9px;font-size:var(--f-note);line-height:1.3;white-space:nowrap;box-shadow:0 1px 3px rgba(15,27,45,.06)}
.note .tag{font-weight:600;color:var(--c-accent)}
.note .txt:empty,.note .sub:empty{display:none}
.note .sub{font-size:var(--f-noteSub);color:var(--c-muted)}
header{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:16px;padding:12px 16px;pointer-events:none}
header>*{pointer-events:auto}
h1{font-size:15px;font-weight:600;margin:0;white-space:nowrap}
#chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0}
#chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--c-lineSoft);background:var(--c-bg);color:var(--c-muted);border-radius:999px;padding:5px 11px;font:inherit;font-size:var(--f-chip);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--c-accent);border-color:var(--c-accent);color:#fff}
#caption{position:fixed;left:16px;bottom:72px;width:min(440px,calc(100% - 32px));background:rgba(255,255,255,.94);border:1px solid var(--c-lineSoft);border-radius:12px;padding:12px 44px 13px 14px}
#caption .ch{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--c-accent);margin-bottom:4px}
#caption .tx{font-size:var(--f-caption);line-height:1.35}
#caption.short .tx{font-size:var(--f-captionShort)}
#aa{position:absolute;top:8px;right:8px;width:28px;height:24px;border-radius:6px;border:1px solid var(--c-lineSoft);background:var(--c-bg);color:var(--c-muted);font:600 11px/1 var(--f-family);cursor:pointer}
#caption.short #aa{color:var(--c-accent);border-color:var(--c-accent)}
#bar{position:fixed;left:0;right:0;bottom:0;height:60px;display:flex;align-items:center;justify-content:center;gap:10px}
.ic{width:38px;height:38px;border-radius:50%;border:1px solid var(--c-lineSoft);background:var(--c-bg);color:var(--c-ink);display:grid;place-items:center;cursor:pointer;padding:0}
.ic svg{width:18px;height:18px}
#play{background:var(--c-accent);border-color:var(--c-accent);color:#fff}
#dots{display:flex;gap:7px;margin:0 6px}
.dot{width:8px;height:8px;border-radius:50%;border:0;padding:0;background:var(--c-lineSoft);cursor:pointer}
.dot.on{background:var(--c-accent)}
body.noui header,body.noui #bar,body.noui #aa{display:none}
@media (max-width:560px){header{flex-direction:column;align-items:flex-start;gap:8px}#chips{max-width:100%}#caption{bottom:68px}}
</style>
</head>
<body>
<div id="view"></div>
<svg id="leaders"></svg>
<div id="notes"></div>
<header><h1></h1><nav id="chips"></nav></header>
<div id="caption"><div class="ch"></div><div class="tx"></div><button id="aa" aria-label="Text size">Aa</button></div>
<div id="bar">
  <button class="ic" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button class="ic" id="play" aria-label="Play or pause"></button>
  <button class="ic" id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div id="dots"></div>
</div>
<!--SCRIPT-->
</body>
</html>
